[env]
    # Local test environment for macOS/Homebrew native libraries
    DYLD_FALLBACK_LIBRARY_PATH = "/opt/homebrew/lib"

[settings]
    python.uv_venv_auto = "create|source"

[tools]
    "pipx:bump-my-version" = "latest"
    "pipx:pyrefly"         = "latest"
    tombi                  = "latest"
    ruff                   = "latest"
    uv                     = "latest"

[tasks.bump]
    description = "Bump the patch digit (CalVer YY.MM.patch → YY.MM.patch+1) and push; no GitHub release"
    tools       = { node = "latest", uv = "latest" }
    run         = "bump-my-version bump patch && git push --follow-tags"

[tasks.release]
    description = "Bump the patch digit, push the commit and tag, and publish the GitHub release"
    # `gh` is intentionally not declared here: it is provided by Homebrew and
    # only needs to be on PATH. scripts/release checks for it and aborts early.
    tools       = { uv = "latest" }
    run         = "scripts/release"

[tasks.lint]
    description = "Lint with ruff, tombi, and pyrefly"
    run         = [
        "ruff check",
        "tombi lint",
        "pyrefly check",
    ]

[tasks.format]
    description = "Format with ruff and tombi"
    run         = [
        "ruff format",
        "tombi format",
    ]

[tasks.test]
    description = "Run fast development tests (excludes real runtimes and external corpus)"
    run         = "uv run pytest -q -m 'not real_runtime and not corpus'"

[tasks."test:fast"]
    description = "Run tests without real runtimes or the external corpus"
    run         = "uv run pytest -q -m 'not real_runtime and not corpus'"

[tasks."test:runtime"]
    description = "Two-family runtime compatibility gate: provisions both lanes and fails if one is skipped"
    depends     = ["sync:da19", "sync:da110"]
    run         = "scripts/test-runtime"

[tasks."test:corpus"]
    description = "External corpus canary gate: provisions the modern lane, validates fixtures, reuses NLTK data"
    depends     = ["sync:da110"]
    run         = "scripts/test-corpus"

[tasks."sync:da19"]
    description = "Provision .venv-da19 with docassemble 1.9.x for the real-runtime lane"
    run         = "env -u VIRTUAL_ENV UV_PROJECT_ENVIRONMENT=.venv-da19 uv sync --group da19"

[tasks."sync:da110"]
    description = "Provision .venv-da110 with docassemble 1.10.x for the real-runtime lane"
    run         = "env -u VIRTUAL_ENV UV_PROJECT_ENVIRONMENT=.venv-da110 uv sync --group da110"

[tasks."test:all-da"]
    description = "Aggregate lane: whole suite with both runtime families wired (corpus tests need their fixtures)"
    depends     = ["sync:da19", "sync:da110"]
    run         = "env -u VIRTUAL_ENV UV_PROJECT_ENVIRONMENT=.venv-da110 DASIMULATOR_REAL_PYTHON=\"$PWD/.venv-da110/bin/python\" DASIMULATOR_REAL_PYTHON_19=\"$PWD/.venv-da19/bin/python\" uv run --group da110 pytest -q"

[tasks.pre-commit]
    description = "Lint, format, and fast-test before committing"
    # The real-runtime and corpus lanes need a provisioned docassemble
    # interpreter plus the external corpus checkout and cost minutes, so they
    # stay out of the commit hook: run `test:all-da` and `test:corpus`
    # explicitly for slow validation; `test` is the everyday fast lane.
    run         = [
        { tasks = ["lint", "format", "test:fast"] },
    ]
