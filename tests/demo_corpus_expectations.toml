# Reviewed expectations for deliberate interview failures and simulator capability
# boundaries belong here. Each entry identifies a canonical interview and phase,
# constrains the observed failure (exit code, error kind, and a stable message
# fragment), and explains why it is expected.
#
# PDF capability boundaries pin the typed `pdf-unavailable` message, not the
# superseded unresolved-variable diagnostic. Optional packages, network,
# credentials, database, session, and machine-learning service failures are not
# listed here: environment-derived blockers stay visible and unwhitelisted.

# Eleven PDF-only attachment requests (ADR-0006).  The simulator removes
# generated PDF formats before conversion and reports the typed capability.
[[expectations]]
    interview      = "docassemble.base:data/questions/examples/allow-emailing-false-pdf.yml"
    phase          = "start"
    classification = "failure"
    returncode     = 2
    error_kind     = "pdf-unavailable"
    message        = "PDF output is unavailable in the simulator"
    reason         = "ADR-0006: a PDF-only attachment is a simulator capability boundary and reports the typed PDF-unavailable failure."
    category       = "capability-boundary"

