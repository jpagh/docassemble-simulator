# Two converter-dependent rtf-to-docx requests (ADR-0001).
[[expectations]]
    interview      = "docassemble.base:data/questions/examples/document-docx-from-rtf.yml"
    phase          = "start"
    classification = "failure"
    returncode     = 2
    error_kind     = "execution"
    message        = "[Errno 2] No such file or directory: 'libreoffice'"
    reason         = "ADR-0001: the simulator never invokes an external converter, and rtf-to-docx requires the absent LibreOffice converter."
    category       = "capability-boundary"

[[expectations]]
    interview      = "docassemble.base:data/questions/examples/document-docx-from-rtf-standalone.yml"
    phase          = "start"
    classification = "failure"
    returncode     = 2
    error_kind     = "execution"
    message        = "[Errno 2] No such file or directory: 'libreoffice'"
    reason         = "ADR-0001: the simulator never invokes an external converter, and rtf-to-docx requires the absent LibreOffice converter."
    category       = "capability-boundary"

