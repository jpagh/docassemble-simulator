[tool.bumpversion]
    commit           = true
    current_version  = "26.9.0"
    message          = "Bump version: {current_version} → {new_version}"
    parse            = """(?x)
(?P<release>
    (?:[0-9]{2})\\.    # YY.
    (?:1[0-2]|[1-9])   # M or MM
)
\\.(?P<patch>\\d+)
"""
    pre_commit_hooks = ["uv lock", "git add uv.lock"]
    serialize        = ["{release}.{patch}"]
    tag              = true
    tag_name         = "v{new_version}"

    [[tool.bumpversion.files]]
        filename = "pyproject.toml"
        key_path = "project.version"
        replace  = "{new_version}"
        search   = "{current_version}"

    [tool.bumpversion.parts.release]
        calver_format = "{0Y}.{MM}"

    [tool.bumpversion.parts.patch]
        first_value = 0
