[project]
    name            = "docassemble-simulator"
    version         = "26.9.0"
    description     = "Run docassemble interviews locally without a server: a CLI for humans and AI agents to load, step through, answer, and debug interviews."
    readme          = "README.md"
    requires-python = ">=3.11"
    license         = "MIT"
    license-files   = ["LICENSE"]
    authors         = [{ name = "Jack Adamson", email = "jackadamson@gmail.com" }]
    dependencies    = [
        "pyyaml>=6.0.3",
    ]

    [project.urls]
        Repository = "https://github.com/jpagh/docassemble-simulator"

    [project.scripts]
        docassemble-simulator = "docassemble_simulator.cli:main"
        sim                   = "docassemble_simulator.cli:main"

[dependency-groups]
    dev   = [
        "docxtpl>=0.20.2",
        "pytest>=9.1.1",
    ]
    # NOTE: `docassemble` itself is intentionally NOT a default dependency.
    # The simulator must run inside the same interpreter environment as the
    # target docassemble package, because it imports docassemble.base
    # directly and drives the real interview machinery. Versioned target
    # packages live in the opt-in groups below (`uv run --group da19 ...` /
    # `--group da110 ...`); each group provisions a tested
    # docassemble/AssemblyLine pair for the compatibility matrix documented in
    # docs/runtime-compatibility.md. The `test:all-da` mise task provisions
    # isolated `.venv-da*` environments from these groups so the cross-family
    # contract in tests/test_real_runtime.py runs against both families at once.
    da19  = [
        "docassemble-assemblyline>=4.8,<5; python_version >= '3.12'",
        "docassemble-base>=1.9,<1.10",
        "docassemble-webapp>=1.9,<1.10",
    ]
    da110 = [
        "docassemble-assemblyline>=4.8,<5; python_version >= '3.12'",
        "docassemble-base>=1.10,<1.11",
        "docassemble-webapp>=1.10,<1.11",
    ]

[build-system]
    requires      = ["uv_build>=0.12.5,<0.13.0"]
    build-backend = "uv_build"

[tool.pyrefly]
    project-includes       = [
        "**/*.py*",
        "**/*.ipynb",
    ]
    preset                 = "basic"
    # Shared fast-test helpers live in tests/ outside the src import root.
    search-path            = ["src", "tests"]
    # docassemble must run inside the target package interpreter and is
    # deliberately not a simulator dependency (see the dependency-groups
    # comment above). The real-runtime lane type-checks against it; the
    # default environment treats those imports as Any instead of failing lint.
    ignore-missing-imports = ["docassemble", "docassemble.*", "tzlocal"]

[tool.pytest.ini_options]
    markers = [
        "real_runtime: requires a real docassemble interpreter",
        "corpus: exercises the external docassemble example corpus",
    ]

[tool.uv]
    # da19 and da110 pin disjoint versions of the same target packages, so
    # they can never be installed together. Declaring the conflict lets uv
    # resolve and lock each family separately (`uv sync --group da19`, ...).
    conflicts               = [
        [{ group = "da19" }, { group = "da110" }],
    ]
    # AssemblyLine -> ALToolbox -> markitdown[pdf] -> magika -> onnxruntime.
    # Universal resolution otherwise backtracks to onnxruntime 1.20.x, which
    # has no CPython 3.14 wheels and makes the whole lock uninstallable.
    constraint-dependencies = ["onnxruntime>=1.30.0; sys_platform != 'win32'"]
